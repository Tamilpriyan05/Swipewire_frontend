<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sw-wire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="sw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4338ca" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sw-bg)" filter="url(#sw-glow)" />

  <!-- Inner border highlight -->
  <rect x="5" y="5" width="54" height="54" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- SwipeWire emblem (Dynamic stylized S wire) -->
  <path
    d="M44 20H26C21.5817 20 18 23.5817 18 28C18 32.4183 21.5817 36 26 36H38C42.4183 36 46 39.5817 46 44C46 48.4183 42.4183 52 38 52H20"
    stroke="url(#sw-wire)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Interactive signal nodes / dots -->
  <circle cx="44" cy="20" r="3.5" fill="#38bdf8" />
  <circle cx="20" cy="52" r="3.5" fill="#a78bfa" />
  <circle cx="32" cy="36" r="2.5" fill="#ffffff" />
</svg>
