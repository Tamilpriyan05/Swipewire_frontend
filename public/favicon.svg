<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="sw-wire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="sw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4338ca" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#sw-bg)" filter="url(#sw-glow)" />

  <!-- Inner border highlight -->
  <rect x="5" y="5" width="54" height="54" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- NovaCart emblem (Sleek cart with spark) -->
  <path
    d="M16 18H23L27.5 39C27.9 41 29.7 42.5 31.8 42.5H45C47.1 42.5 48.9 41 49.3 39L53 25H25"
    stroke="url(#sw-wire)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="33" cy="49" r="3.5" fill="#ffffff" />
  <circle cx="46" cy="49" r="3.5" fill="#38bdf8" />
  <path d="M38 17L41.5 20.5L47.5 14.5" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
